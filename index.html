<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Chat 💬</title>

<style>
:root{
  --bg:#f0f2f5;
  --card:#fff;
  --chat:#e8eaf6;
  --self:#6a5acd;
  --other:#d1c4e9;
  --text:#000;
}

/* ===== THEMES ===== */
.theme-default{
  --bg:#f0f2f5;
  --card:#fff;
  --chat:#e8eaf6;
  --self:#6a5acd;
  --other:#d1c4e9;
  --text:#000;
}

.theme-dark{
  --bg:#0f172a;
  --card:#020617;
  --chat:#020617;
  --self:#22d3ee;
  --other:#334155;
  --text:#e5e7eb;
}

.theme-sunset{
  --bg:#fff1eb;
  --card:#ffe4d6;
  --chat:#ffd6c9;
  --self:#ff6b35;
  --other:#ffb703;
  --text:#3a1f04;
}

.theme-forest{
  --bg:#ecfdf5;
  --card:#d1fae5;
  --chat:#bbf7d0;
  --self:#065f46;
  --other:#34d399;
  --text:#022c22;
}

.theme-neon{
  --bg:#020617;
  --card:#020617;
  --chat:#020617;
  --self:#a855f7;
  --other:#22d3ee;
  --text:#f9fafb;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.chat-container{
  width:100%;
  max-width:420px;
  height:650px;
  background:var(--card);
  border-radius:12px;
  box-shadow:0 0 20px rgba(0,0,0,.25);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
}

.chat-header{
  background:var(--self);
  color:white;
  padding:15px;
  text-align:center;
  font-weight:bold;
}

.menu-btn{
  position:absolute;
  left:15px;
  top:15px;
  font-size:22px;
  cursor:pointer;
}

.menu{
  position:absolute;
  top:55px;
  left:10px;
  background:white;
  width:230px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,.3);
  padding:10px;
  display:none;
  z-index:10;
}

.menu input, .menu button{
  width:100%;
  padding:7px;
  margin-bottom:6px;
  border-radius:6px;
  border:1px solid #ccc;
  font-size:13px;
}

.menu button{
  background:var(--self);
  color:white;
  border:none;
  cursor:pointer;
}

.menu hr{
  margin:8px 0;
}

.menu small{
  display:block;
  text-align:center;
  margin-top:5px;
  opacity:.7;
}

.chat-box{
  flex:1;
  padding:15px;
  background:var(--chat);
  overflow-y:auto;
  display:flex;
  flex-direction:column;
}

.chat-message{
  max-width:75%;
  margin-bottom:12px;
  padding:10px 14px;
  border-radius:16px;
  word-wrap:break-word;
}

.self{ background:var(--self); color:white; align-self:flex-end; }
.other{ background:var(--other); align-self:flex-start; }

.name{ font-weight:bold; font-size:13px; }
.time{ font-size:10px; opacity:.7; text-align:right; }

.chat-btns{
  display:flex;
  gap:5px;
  justify-content:flex-end;
  margin-top:4px;
}

.chat-btns button{
  font-size:11px;
  padding:3px 6px;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

.edit{ background:#4caf50; color:white; }
.delete{ background:#f44336; color:white; }

.chat-form{
  display:flex;
  border-top:1px solid #ccc;
}

.chat-form input{
  flex:1;
  padding:12px;
  border:none;
  outline:none;
}

.chat-form button{
  padding:0 18px;
  border:none;
  background:var(--self);
  color:white;
  cursor:pointer;
}
</style>
</head>

<body class="theme-default">

<div class="chat-container">
  <div class="chat-header">
    <span class="menu-btn" onclick="toggleMenu()">⋮</span>
    <span id="room-title">Public Chat 🌍</span>
  </div>

  <div class="menu" id="menu">
    <input id="roomInput" placeholder="Enter room code">
    <button onclick="joinRoom()">Join / Create Room</button>
    <button onclick="leaveRoom()">Leave Room</button>
    <small>Same code = same room</small>

    <hr>
    <button onclick="setTheme('theme-default')">🌤 Default</button>
    <button onclick="setTheme('theme-dark')">🌙 Dark</button>
    <button onclick="setTheme('theme-sunset')">🌅 Sunset</button>
    <button onclick="setTheme('theme-forest')">🌲 Forest</button>
    <button onclick="setTheme('theme-neon')">⚡ Neon</button>

    <hr>
    <input type="color" id="cSelf">
    <input type="color" id="cOther">
    <button onclick="applyCustomTheme()">🎨 Custom Theme</button>
  </div>

  <div class="chat-box" id="chatBox"></div>

  <form class="chat-form" id="chatForm">
    <input id="msgInput" placeholder="Type message..." required>
    <button>Send</button>
  </form>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAb3XQPGpk143SPX9JmhUHpXkACxBb8LY0",
  authDomain: "chat-online-2aeaf.firebaseapp.com",
  databaseURL: "https://chat-online-2aeaf-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "chat-online-2aeaf",
  storageBucket: "chat-online-2aeaf.firebasestorage.app",
  messagingSenderId: "817572486888",
  appId: "1:817572486888:web:21271cfaf54849b659f35d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let username = localStorage.getItem("chatName");
if(!username){
  username = prompt("Enter your name 👋");
  localStorage.setItem("chatName", username || "User");
}

let currentPath = "messages/public";
let messagesRef = db.ref(currentPath);

const chatBox = document.getElementById("chatBox");
const roomTitle = document.getElementById("room-title");

function listenMessages(){
  chatBox.innerHTML="";
  messagesRef.off();
  messagesRef.on("child_added", snap=>{
    renderMessage(snap.key, snap.val());
  });
}

listenMessages();

chatForm.onsubmit = e=>{
  e.preventDefault();
  const text = msgInput.value.trim();
  if(!text) return;
  messagesRef.push({ name:username, text, time:Date.now() });
  msgInput.value="";
};

function renderMessage(key,data){
  const div=document.createElement("div");
  div.className="chat-message "+(data.name===username?"self":"other");

  div.innerHTML=`
    <div class="name" style="color:${colorOf(data.name)}">${data.name}</div>
    <div>${data.text}</div>
    <div class="time">${new Date(data.time).toLocaleTimeString()}</div>
  `;

  if(data.name===username){
    const btns=document.createElement("div");
    btns.className="chat-btns";

    const e=document.createElement("button");
    e.className="edit";
    e.textContent="Edit";
    e.onclick=()=>{
      const t=prompt("Edit message",data.text);
      if(t) messagesRef.child(key).update({text:t});
    };

    const d=document.createElement("button");
    d.className="delete";
    d.textContent="Delete";
    d.onclick=()=>messagesRef.child(key).remove();

    btns.append(e,d);
    div.appendChild(btns);
  }

  chatBox.appendChild(div);
  chatBox.scrollTop=chatBox.scrollHeight;
}

function joinRoom(){
  const code = roomInput.value.trim();
  if(!code) return;
  currentPath = "messages/rooms/"+code;
  messagesRef = db.ref(currentPath);
  roomTitle.textContent = "Room: "+code+" 🔒";
  listenMessages();
  toggleMenu();
}

function leaveRoom(){
  currentPath="messages/public";
  messagesRef=db.ref(currentPath);
  roomTitle.textContent="Public Chat 🌍";
  listenMessages();
  toggleMenu();
}

function toggleMenu(){
  const m=document.getElementById("menu");
  m.style.display = m.style.display==="block"?"none":"block";
}

function colorOf(name){
  let h=0;
  for(let i=0;i<name.length;i++) h=name.charCodeAt(i)+((h<<5)-h);
  return `hsl(${h%360},70%,50%)`;
}

/* ===== THEME LOGIC ===== */
const savedTheme = localStorage.getItem("chatTheme");
if(savedTheme) document.body.className = savedTheme;

function setTheme(t){
  document.body.className = t;
  localStorage.setItem("chatTheme", t);
}

function applyCustomTheme(){
  const s = cSelf.value;
  const o = cOther.value;
  document.body.className="";
  document.documentElement.style.setProperty("--self", s);
  document.documentElement.style.setProperty("--other", o);
  localStorage.setItem("chatTheme","");
  localStorage.setItem("customSelf",s);
  localStorage.setItem("customOther",o);
}

const cs=localStorage.getItem("customSelf");
const co=localStorage.getItem("customOther");
if(cs&&co){
  document.documentElement.style.setProperty("--self",cs);
  document.documentElement.style.setProperty("--other",co);
}
</script>

</body>
</html>
